[project]
name = "ksor-worker-evals"
version = "0.1.0"
description = "Golden dataset and eval harness for the ksor-worker agents (separate uv project so its dependency pins never touch the app's lock)."
requires-python = ">=3.12"
dependencies = [
    "ksor-worker",
    "deepeval",
    "ragas",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4
    "langchain-community<0.4",
    "pytest",
    "httpx>=0.28.1",
]

[tool.uv.sources]
ksor-worker = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["suites"]
markers = ["live: needs OPENAI_API_KEY, the KSOR MCP server and a running worker (uvicorn main:app)"]
