name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Install and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (incl. dev)
        run: uv sync --locked --group dev

      # No OPENAI_API_KEY and no live KSOR server in CI, so this only
      # exercises what needs neither: the app object builds, and /health
      # actually responds — not just "it imports". /ask and /compare need a
      # real key and a running MCP server, so they're verified locally
      # (see README.md), not in CI.
      - name: Smoke test (GET /health)
        run: uv run --group dev python tests/test_health.py
